<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1329"/>
      <stop offset="100%" stop-color="#07090e"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <rect width="800" height="450" fill="url(#bgGrad)"/>
  
  <!-- Subtle Grid -->
  <g stroke="#1e293b" stroke-width="1" opacity="0.4">
    <line x1="0" y1="90" x2="800" y2="90"/>
    <line x1="0" y1="180" x2="800" y2="180"/>
    <line x1="0" y1="270" x2="800" y2="270"/>
    <line x1="0" y1="360" x2="800" y2="360"/>
    <line x1="160" y1="0" x2="160" y2="450"/>
    <line x1="320" y1="0" x2="320" y2="450"/>
    <line x1="480" y1="0" x2="480" y2="450"/>
    <line x1="640" y1="0" x2="640" y2="450"/>
  </g>

  <!-- Central Visual Mockup Device -->
  <rect x="270" y="45" width="260" height="360" rx="28" fill="#0f172a" stroke="#334155" stroke-width="3"/>
  <rect x="282" y="58" width="236" height="334" rx="20" fill="#0b0f19"/>
  
  <!-- Mobile App Header -->
  <rect x="300" y="80" width="100" height="12" rx="6" fill="#38bdf8"/>
  <circle cx="495" cy="86" r="10" fill="#1e293b"/>

  <!-- Persona Cards (Buyer / Supplier / Reseller) -->
  <rect x="300" y="115" width="60" height="24" rx="6" fill="#06b6d4" opacity="0.3"/>
  <text x="330" y="131" fill="#38bdf8" font-family="sans-serif" font-size="9" text-anchor="middle" font-weight="bold">BUYER</text>
  
  <rect x="370" y="115" width="60" height="24" rx="6" fill="#1e293b"/>
  <text x="400" y="131" fill="#94a3b8" font-family="sans-serif" font-size="9" text-anchor="middle">SUPPLIER</text>

  <rect x="440" y="115" width="60" height="24" rx="6" fill="#1e293b"/>
  <text x="470" y="131" fill="#94a3b8" font-family="sans-serif" font-size="9" text-anchor="middle">RESELLER</text>

  <!-- Marketplace Items Grid -->
  <rect x="300" y="160" width="95" height="100" rx="10" fill="#141d2d" stroke="#1e293b"/>
  <rect x="310" y="170" width="75" height="45" rx="6" fill="#1e293b"/>
  <rect x="310" y="225" width="55" height="8" rx="4" fill="#64748b"/>
  <rect x="310" y="240" width="40" height="8" rx="4" fill="#06b6d4"/>

  <rect x="405" y="160" width="95" height="100" rx="10" fill="#141d2d" stroke="#1e293b"/>
  <rect x="415" y="170" width="75" height="45" rx="6" fill="#1e293b"/>
  <rect x="415" y="225" width="55" height="8" rx="4" fill="#64748b"/>
  <rect x="415" y="240" width="40" height="8" rx="4" fill="#06b6d4"/>

  <!-- Secure Database / RLS Badge -->
  <rect x="300" y="280" width="200" height="55" rx="10" fill="#0f172a" stroke="#06b6d4" stroke-width="1" stroke-dasharray="4 2"/>
  <circle cx="325" cy="307" r="12" fill="#06b6d4" opacity="0.2"/>
  <text x="325" y="311" fill="#38bdf8" font-family="monospace" font-size="11" text-anchor="middle">RLS</text>
  <text x="348" y="303" fill="#ffffff" font-family="sans-serif" font-size="11" font-weight="bold">PostgreSQL Security</text>
  <text x="348" y="318" fill="#94a3b8" font-family="sans-serif" font-size="9">Row Level Security Active</text>

  <!-- Ambient Glow Effects -->
  <circle cx="400" cy="225" r="140" fill="#06b6d4" opacity="0.08" filter="url(#glow)"/>
</svg>
