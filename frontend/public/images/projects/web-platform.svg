<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <rect width="800" height="450" fill="#0b0f19"/>
  <rect x="50" y="40" width="700" height="370" rx="16" fill="#0f172a" stroke="#1e293b" stroke-width="2"/>
  
  <!-- Browser Chrome -->
  <rect x="50" y="40" width="700" height="40" rx="16" fill="#141d2d"/>
  <circle cx="80" cy="60" r="6" fill="#ef4444"/>
  <circle cx="100" cy="60" r="6" fill="#f59e0b"/>
  <circle cx="120" cy="60" r="6" fill="#10b981"/>
  <rect x="160" y="50" width="360" height="20" rx="6" fill="#0b0f19"/>
  <text x="180" y="64" fill="#64748b" font-family="monospace" font-size="10">https://platform.internal/dashboard</text>

  <!-- Sidebar -->
  <rect x="70" y="100" width="160" height="290" rx="10" fill="#0b0f19"/>
  <rect x="90" y="120" width="120" height="14" rx="4" fill="#38bdf8"/>
  <rect x="90" y="150" width="100" height="10" rx="3" fill="#334155"/>
  <rect x="90" y="175" width="110" height="10" rx="3" fill="#334155"/>
  <rect x="90" y="200" width="85" height="10" rx="3" fill="#334155"/>

  <!-- Main Grid -->
  <rect x="250" y="100" width="480" height="120" rx="10" fill="#141d2d"/>
  <rect x="270" y="120" width="120" height="12" rx="4" fill="#06b6d4"/>
  <rect x="270" y="145" width="200" height="8" rx="4" fill="#64748b"/>
  <!-- Metric boxes -->
  <rect x="270" y="170" width="130" height="35" rx="6" fill="#0b0f19"/>
  <rect x="420" y="170" width="130" height="35" rx="6" fill="#0b0f19"/>
  <rect x="570" y="170" width="130" height="35" rx="6" fill="#0b0f19"/>

  <!-- Table Preview -->
  <rect x="250" y="235" width="480" height="155" rx="10" fill="#141d2d"/>
  <line x1="250" y1="275" x2="730" y2="275" stroke="#334155"/>
  <line x1="250" y1="315" x2="730" y2="315" stroke="#334155"/>
  <line x1="250" y1="355" x2="730" y2="355" stroke="#334155"/>
</svg>
