<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <rect width="800" height="450" fill="#07090e"/>
  <defs>
    <linearGradient id="cGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
  </defs>

  <!-- Title -->
  <text x="400" y="45" fill="#38bdf8" font-family="monospace" font-size="14" text-anchor="middle" letter-spacing="2">XORA ECOSYSTEM ARCHITECTURE</text>

  <!-- Client Layer -->
  <rect x="100" y="90" width="180" height="270" rx="14" fill="#0f172a" stroke="#1e293b" stroke-width="2"/>
  <text x="190" y="125" fill="#ffffff" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle">Android Client</text>
  <text x="190" y="145" fill="#38bdf8" font-family="monospace" font-size="11" text-anchor="middle">Kotlin + Jetpack</text>
  <rect x="120" y="170" width="140" height="35" rx="6" fill="#1e293b"/>
  <text x="190" y="192" fill="#cbd5e1" font-family="sans-serif" font-size="11" text-anchor="middle">Buyer Flow</text>
  <rect x="120" y="215" width="140" height="35" rx="6" fill="#1e293b"/>
  <text x="190" y="237" fill="#cbd5e1" font-family="sans-serif" font-size="11" text-anchor="middle">Supplier Dashboard</text>
  <rect x="120" y="260" width="140" height="35" rx="6" fill="#1e293b"/>
  <text x="190" y="282" fill="#cbd5e1" font-family="sans-serif" font-size="11" text-anchor="middle">Reseller Portal</text>
  <rect x="120" y="305" width="140" height="35" rx="6" fill="#1e293b"/>
  <text x="190" y="327" fill="#cbd5e1" font-family="sans-serif" font-size="11" text-anchor="middle">Room SQLite Offline</text>

  <!-- Connector 1 -->
  <line x1="280" y1="225" x2="350" y2="225" stroke="#06b6d4" stroke-width="2" stroke-dasharray="4 4"/>
  <polygon points="350,225 342,220 342,230" fill="#06b6d4"/>

  <!-- Middleware / REST API Layer -->
  <rect x="350" y="130" width="140" height="190" rx="14" fill="#0f172a" stroke="#06b6d4" stroke-width="2"/>
  <text x="420" y="165" fill="#ffffff" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle">REST &amp; Auth</text>
  <text x="420" y="185" fill="#94a3b8" font-family="monospace" font-size="10" text-anchor="middle">JWT Verification</text>
  <rect x="365" y="205" width="110" height="30" rx="6" fill="#1e293b"/>
  <text x="420" y="224" fill="#38bdf8" font-family="sans-serif" font-size="10" text-anchor="middle">Rate Limiting</text>
  <rect x="365" y="245" width="110" height="30" rx="6" fill="#1e293b"/>
  <text x="420" y="264" fill="#38bdf8" font-family="sans-serif" font-size="10" text-anchor="middle">Role Router</text>

  <!-- Connector 2 -->
  <line x1="490" y1="225" x2="560" y2="225" stroke="#3b82f6" stroke-width="2" stroke-dasharray="4 4"/>
  <polygon points="560,225 552,220 552,230" fill="#3b82f6"/>

  <!-- Database & Storage Layer -->
  <rect x="560" y="90" width="180" height="270" rx="14" fill="#0f172a" stroke="#3b82f6" stroke-width="2"/>
  <text x="650" y="125" fill="#ffffff" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle">Supabase Cloud</text>
  <text x="650" y="145" fill="#3b82f6" font-family="monospace" font-size="11" text-anchor="middle">PostgreSQL Core</text>
  <rect x="580" y="170" width="140" height="35" rx="6" fill="#1e293b"/>
  <text x="650" y="192" fill="#34d399" font-family="sans-serif" font-size="11" text-anchor="middle">Row Level Security</text>
  <rect x="580" y="215" width="140" height="35" rx="6" fill="#1e293b"/>
  <text x="650" y="237" fill="#cbd5e1" font-family="sans-serif" font-size="11" text-anchor="middle">Catalog Tables</text>
  <rect x="580" y="260" width="140" height="35" rx="6" fill="#1e293b"/>
  <text x="650" y="282" fill="#cbd5e1" font-family="sans-serif" font-size="11" text-anchor="middle">Order Records</text>
  <rect x="580" y="305" width="140" height="35" rx="6" fill="#1e293b"/>
  <text x="650" y="327" fill="#cbd5e1" font-family="sans-serif" font-size="11" text-anchor="middle">Media Storage</text>
</svg>
